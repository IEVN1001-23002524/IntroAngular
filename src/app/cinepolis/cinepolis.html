<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="grande">
        <div style="width: 100%; display: flex; flex-direction: row;">
            <div class="contenedor">
                <form class="col-7">
                    <h2>Entradas</h2>
                    <label>Nombre: </label>
                    <input [(ngModel)]="nombre" type="text" name="nombre" id="nombre" class="tamano">
                    <br>

                    <label>Cantidad de compradores:</label>
                    <input [(ngModel)]="cantidad" type="text" name="cantidad" id="cantidad" class="tamano">
                    <br>

                    <label>Tarjeta cinepolis: </label>
                    <input [(ngModel)]="tarjeta" type="radio" name="tarjeta" value="si" id="si">
                    <label for="si">Sí</label>
                    <input [(ngModel)]="tarjeta" type="radio" name="tarjeta" value="no">
                    <label for="no">No</label>
                    <br>

                    <Label>Cantidad de boletos: </Label>
                    <input [(ngModel)]="boletos" type="text" name="boletos" id="boletos" class="tamano">
                    <br>
                </form>
            </div>
            <div class="segundoContenedor">
                <form>
                    <h2>Salidas</h2>
                    <label>Valor a pagar: </label>
                    <input [(ngModel)]="valor" type="number" name="valor" id="valor" class="tamano">
                </form>
            </div>
        </div>
        <div class="acciones">
            <form >
                <h2>Acciones</h2>
                <button type="button" (click)="procesar()">Procesar</button>
                <button type="button" (click)="salir()">Salir</button>
            </form>
        </div>
    </div>
</body>

</html>
