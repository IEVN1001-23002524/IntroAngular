

<div class="card">
    <div class="card-header">
        <div class="card-body">
            <div class="row">
                <div class="col-md-2">
                    Filtrar por:
                </div>
                <div class="col-md-2">
                    <input [(ngModel)]="listFilter" type="text" class="from-control"
                    placeholder="Ingrese nombre del héroe">
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <h3>Filtro: {{ listFilter }} </h3>
                </div>
            </div>
            <div class="table-responsive">
                <div class="table-responsive">
                    <table *ngIf="heroes.length>0" class="table table-striped">
                        <thead>
                            <tr>
                                <th name="Imagen" ><button (click)="showImage()" class="btn btn-primary">
                                    {{muestraImage?'Oculta ':'Muestra '}}Imagen</button></th>
                                <th name="Nombre">Nombre</th>
                                <th name="Descripción">Descipcion</th>
                                <th name="Raza">Raza</th>
                                <th name="ki">Ki</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let heroe of heroes|heroesFilter:listFilter">
                                <td><img *ngIf="muestraImage" [src]="heroe.imagen"
                                    [style.width.px]="imageWidth"
                                    [style.margin.px]="imageMargin">
                                </td>
                                <td>{{ heroe.nombre }}</td>
                                <td>{{ heroe.description }}</td>
                                <td>{{ heroe.raza }}</td>
                                <td>{{ heroe.ki }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
