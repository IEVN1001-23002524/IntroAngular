<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <div class="container">

        <div class="row">

            <div class="col-6">

                <form>

                    <div class="form-group pt-4">

                        <label for="num1">Numero 1: </label>

                        <input
                            [(ngModel)]="num1"
                            name="num1"
                            type="text"
                            class="form-control"
                            id="num1"
                            placeholder="Ingrese numero 1">

                    </div>

                    <div class="form-group pt-4">

                        <label for="num2">Numero 2: </label>

                        <input
                            [(ngModel)]="num2"
                            name="num2"
                            type="text"
                            class="form-control"
                            id="num2"
                            placeholder="Ingrese numero 2">

                    </div>

                    <br>

                    <label for="">
                        Multiplicar
                    </label>

                    <input
                        type="radio"
                        name="operacion"
                        value="multiplicar"
                        [(ngModel)]="operacionSeleccionada">

                    <br>

                    <label for="">
                        Sumar
                    </label>

                    <input
                        type="radio"
                        name="operacion"
                        value="sumar"
                        [(ngModel)]="operacionSeleccionada">

                    <br>

                    <label for="">
                        Dividir
                    </label>

                    <input
                        type="radio"
                        name="operacion"
                        value="dividir"
                        [(ngModel)]="operacionSeleccionada">

                    <br>

                    <label for="">
                        Restar
                    </label>

                    <input
                        type="radio"
                        name="operacion"
                        value="restar"
                        [(ngModel)]="operacionSeleccionada">

                    <br><br>

                    <button
                        type="button"
                        class="btn btn-primary"
                        (click)="ejecutarOperacion()">

                        Calcular

                    </button>

                </form>

            </div>

            <div class="col-6">

                <h2>
                    Resultado: {{ resultado }}
                </h2>

            </div>

        </div>

    </div>

</body>

</html>
