<div class="container">

    <h2>Distancia entre dos puntos</h2>

    <label>X1:</label>
    <input [(ngModel)]="x1" name="x1" type="text">

    <br><br>

    <label>Y1:</label>
    <input [(ngModel)]="y1" name="y1" type="text">

    <br><br>

    <label>X2:</label>
    <input [(ngModel)]="x2" name="x2" type="text">

    <br><br>

    <label>Y2:</label>
    <input [(ngModel)]="y2" name="y2" type="text">

    <br><br>

    <button type="button" (click)="calcular()">
        Calcular
    </button>

    <h3>Resultado: {{ resultado }}</h3>

</div>
