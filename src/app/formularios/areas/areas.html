<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Areas calculadas</title>
</head>
<body>
    <div class="container">
    <div class="row">
        <div class="col-6">
            <form>
                <div class="form-group pt-4">
                    <label for="num1">Numero 1:</label>
                    <input
                        [(ngModel)]="num1"
                        name="num1"
                        type="text"
                        class="form-control"
                        id="num1"
                        placeholder="Ingrese numero 1">
                </div>
                <div class="form-group pt-4">
                    <label for="num2">Numero 2:</label>

                    <input
                        [(ngModel)]="num2"
                        name="num2"
                        type="text"
                        class="form-control"
                        id="num2"
                        placeholder="Ingrese numero 2">
                </div>
                <br>
                <label>
                    Círculo
                </label>
                <input
                    type="radio"
                    name="figura"
                    value="circulo"
                    [(ngModel)]="figuraSeleccionada">
                <br>
                <label>
                    Rectángulo
                </label>
                <input
                    type="radio"
                    name="figura"
                    value="rectangulo"
                    [(ngModel)]="figuraSeleccionada">
                <br>
                <label>
                    Triángulo
                </label>
                <input
                    type="radio"
                    name="figura"
                    value="triangulo"
                    [(ngModel)]="figuraSeleccionada">
                <br>
                <label>
                    Pentágono
                </label>
                <input
                    type="radio"
                    name="figura"
                    value="pentagono"
                    [(ngModel)]="figuraSeleccionada">
                <br><br>
                <button
                    type="button"
                    class="btn btn-primary"
                    (click)="calcular()">
                    Calcular
                </button>
            </form>
        </div>
        <div class="col-6">
            <h2>
                Resultado: {{ resultado }}
            </h2>
        </div>
    </div>
</div>
</body>
</html>
